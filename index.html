<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>To-Do List</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Referenced by the .todo-item/.modal panels' backdrop-filter
       (style.css), chained with a small blur() there -- pure distortion here
       (feTurbulence + feDisplacementMap warps the backdrop like uneven
       glass) rather than uniformly smearing it, with just a touch of blur
       layered on top in CSS for a softer edge. -->
  <svg width="0" height="0" style="position: absolute">
    <filter id="glass-distort" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="2" seed="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="12" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <div id="login-screen" class="modal-overlay hidden">
    <div class="modal login-modal">
      <div class="modal-title">Log in</div>
      <form id="login-form">
        <div class="modal-field">
          <label for="login-username">Username</label>
          <input id="login-username" class="modal-input" type="text" autocomplete="username">
        </div>
        <div class="modal-field">
          <label for="login-password">Password</label>
          <input id="login-password" class="modal-input" type="password" autocomplete="current-password">
        </div>
        <div class="modal-actions">
          <button type="submit" class="modal-ok">Log in</button>
        </div>
      </form>
    </div>
  </div>

  <main id="app-main" class="hidden">
    <div class="todo-column">
      <div class="app-header">
        <h1>To-Do List</h1>
        <div class="app-header-actions">
          <button id="logout-btn" class="menu-btn-small" title="Log out (for testing the login screen)">Log out</button>
          <button id="todo-manage-btn" class="menu-btn-small">Manage tasks&hellip;</button>
        </div>
      </div>

      <div id="todo-section" class="todo-section hidden">
        <div class="todo-toolbar">
          <div id="todo-month-nav" class="todo-month-nav">
            <button type="button" id="todo-month-prev" class="todo-month-nav-btn" title="Previous month"></button>
            <span id="todo-month-label" class="todo-month-label"></span>
            <button type="button" id="todo-month-next" class="todo-month-nav-btn" title="Next month"></button>
          </div>
          <div id="todo-view-toggle" class="todo-view-toggle">
            <div class="todo-view-toggle-thumb"></div>
            <button type="button" class="todo-view-toggle-opt" data-mode="pending" title="Pending &amp; overdue tasks this month"></button>
            <button type="button" class="todo-view-toggle-opt" data-mode="next-recurrence" title="Next recurrence of every task"></button>
            <button type="button" class="todo-view-toggle-opt" data-mode="all" title="All tasks this month"></button>
          </div>
        </div>
        <div id="todo-viewport">
          <div id="todo-list"></div>
        </div>
      </div>
    </div>

    <div class="side-panel">
      <div id="side-panel-empty" class="side-panel-empty">Click a task to see its notes and history.</div>
      <div id="side-panel-content" class="side-panel-content hidden">
        <div class="side-panel-header">
          <div id="side-panel-title" class="side-panel-title"></div>
          <button id="side-panel-toggle-btn" class="menu-btn-small"></button>
        </div>
        <div id="side-panel-details" class="side-panel-details hidden"></div>
        <textarea id="side-panel-comment-input" class="modal-input side-panel-comment-input" placeholder="Add a note about this task&hellip;"></textarea>
        <button id="side-panel-comment-add" class="menu-btn-small">Add note</button>
        <div class="side-panel-section-heading">Notes</div>
        <div id="side-panel-comments" class="side-panel-comments"></div>
        <div class="side-panel-section-heading">Activity</div>
        <div id="side-panel-log" class="side-panel-log"></div>
      </div>
    </div>
  </main>

  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-title"></div>
      <div class="modal-fields"></div>
      <div class="modal-actions">
        <button class="modal-cancel">Cancel</button>
        <button class="modal-ok">OK</button>
      </div>
    </div>
  </div>

  <div id="todo-manage-overlay" class="modal-overlay hidden">
    <div class="modal todo-manage-modal">
      <button id="todo-manage-close" class="modal-close-btn" title="Close">
        <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="modal-title">To-do list</div>
      <div class="todo-manage-panes">
        <div class="todo-manage-left">
          <div id="todo-manage-months"></div>
          <button id="todo-add-btn" class="menu-btn-small">+ Add task</button>
        </div>
        <div class="todo-manage-right">
          <div id="series-edit-empty" class="todo-manage-empty">Select a series on the left to edit it.</div>
          <div id="series-edit-panel" class="hidden">
            <div class="series-edit-name-row">
              <input id="series-edit-name-input" class="modal-input" type="text" placeholder="Series name">
              <button id="series-edit-rename-btn" class="menu-btn-small">Rename all</button>
            </div>
            <div id="series-edit-list"></div>
            <button id="series-edit-add-new-btn" class="menu-btn-small">+ Add new task</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="edit-scope-overlay" class="modal-overlay hidden">
    <div class="modal edit-scope-modal">
      <div class="modal-title">Edit recurring task</div>
      <p class="edit-scope-desc">This task repeats. What would you like to edit?</p>
      <button id="edit-scope-instance" class="menu-btn-small menu-btn-wide">Only this occurrence</button>
      <button id="edit-scope-following" class="menu-btn-small menu-btn-wide">This and following occurrences</button>
      <button id="edit-scope-all" class="menu-btn-small menu-btn-wide">All occurrences</button>
      <div class="modal-actions">
        <button id="edit-scope-cancel" class="modal-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <div id="task-stats-overlay" class="modal-overlay hidden">
    <div class="modal task-stats-modal">
      <button id="task-stats-close" class="modal-close-btn" title="Close">
        <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="modal-title" id="task-stats-title"></div>
      <div id="task-stats-body"></div>
    </div>
  </div>

  <script src="sharedInputBehavior.js"></script>
  <script src="recurrence.js"></script>
  <script src="app.js"></script>
</body>
</html>
