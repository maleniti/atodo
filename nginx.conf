# Replaces nginx:alpine's stock /etc/nginx/conf.d/default.conf (same
# server block otherwise) to add Cache-Control: no-cache. Without it nginx
# sends only Last-Modified/ETag, so browsers heuristically keep serving a
# cached app.js/occurrence.js/... after a redeploy -- and a tab still
# running stale code isn't just cosmetic here: saveTasks() PUTs the whole
# task/occurrence state, so old logic can write back data the new logic
# would never produce. no-cache still lets the browser keep its copy, it
# just revalidates first (a cheap 304 via the ETag when nothing changed).
server {
    listen       80;
    # Stated explicitly: nginx:alpine's 10-listen-on-ipv6-by-default.sh only
    # adds this to an unmodified stock default.conf, which this no longer is.
    listen       [::]:80;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        add_header Cache-Control "no-cache" always;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
